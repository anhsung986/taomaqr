<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Tạo mã QR Pro</title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #2e1065 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
            color: #f8fafc;
            overflow-y: auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #7c3aed, #d946ef);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.4);
            margin-bottom: 12px;
            color: #ffffff;
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            resize: vertical;
            min-height: 110px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
        }

        .advanced-settings {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }
        
        .setting-title {
            font-size: 11px;
            font-weight: 800;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .setting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .setting-label {
            font-size: 13px;
            color: #94a3b8;
        }
        
        input[type="color"] {
            border: none;
            width: 40px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            outline: none;
        }
        
        input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 13px;
            outline: none;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
        }
        
        .btn-generate:active {
            transform: scale(0.97);
        }

        /* Khung nhúng thông báo (Embed Status Box) */
        .status-embed {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .status-embed.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .status-embed.error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        .status-embed.hidden {
            display: none !important;
        }

        .qrcode-box {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: translateY(10px);
        }
        
        .qrcode-box.active {
            opacity: 1;
            transform: translateY(0);
        }

        #qrcode {
            padding: 12px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            margin-bottom: 12px;
        }

        #qrcode img {
            display: block;
            border-radius: 10px;
        }

        .save-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
            text-align: center;
        }

        .qrcode-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .btn-action {
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-open {
            background: linear-gradient(135deg, #10b981, #0d9488);
            color: #ffffff;
        }
        
        .btn-copy-link {
            background: #334155;
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="icon-badge"><i class="fa-solid fa-qrcode"></i></div>
            <h1 class="title">TẠO MÃ QR PRO</h1>
            <p class="subtitle">Nhập nhiều dòng, tùy chỉnh màu sắc linh hoạt</p>
        </div>

        <div class="input-group">
            <textarea id="qr-input" placeholder="Nhập văn bản, đường link hoặc nội dung bất kỳ... Bạn có thể nhấn Enter để xuống dòng.">https://google.com</textarea>
        </div>

        <div class="advanced-settings">
            <div class="setting-title"><i class="fa-solid fa-sliders"></i> Cài đặt nâng cao</div>
            <div class="setting-grid">
                <div class="setting-item">
                    <span class="setting-label">Màu mã:</span>
                    <input type="color" id="qr-color-dark" value="#000000">
                </div>
                <div class="setting-item">
                    <span class="setting-label">Màu nền:</span>
                    <input type="color" id="qr-color-light" value="#ffffff">
                </div>
                <div class="setting-item" style="grid-column: span 2;">
                    <span class="setting-label">Kích thước (px):</span>
                    <input type="number" id="qr-size" value="180" min="50" max="500" step="10">
                </div>
            </div>
        </div>

        <button class="btn-generate" onclick="generateQR()">
            <i class="fa-solid fa-magic"></i> Tạo Mã QR
        </button>

        <!-- Khung nhúng thông báo (Embed Status Box) -->
        <div id="status-embed" class="status-embed hidden">
            <i id="status-icon" class="fa-solid fa-circle-check"></i>
            <span id="status-text">Thông báo</span>
        </div>
        
        <div id="qrcode-box" class="qrcode-box">
            <div id="qrcode"></div>
            <p class="save-hint"><i class="fa-solid fa-circle-info"></i> Nhấn giữ vào ảnh mã QR để lưu về máy</p>
            
            <div id="qrcode-actions" class="qrcode-actions hidden">
                <button class="btn-action btn-copy-link" onclick="copyLink()">
                    <i class="fa-regular fa-copy"></i> Sao chép text
                </button>
                <button class="btn-action btn-open" onclick="openQRImage()">
                    <i class="fa-solid fa-expand"></i> Mở ảnh lớn
                </button>
            </div>
        </div>
    </div>

    <script>
        let qrcode = null;

        function showStatus(message, type = 'success') {
            const statusBox = document.getElementById('status-embed');
            const statusText = document.getElementById('status-text');
            const statusIcon = document.getElementById('status-icon');

            statusText.innerText = message;
            statusBox.className = `status-embed ${type}`;

            if (type === 'success') {
                statusIcon.className = 'fa-solid fa-circle-check';
            } else {
                statusIcon.className = 'fa-solid fa-triangle-exclamation';
            }

            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(() => {
                statusBox.classList.add('hidden');
            }, 4000);
        }

        function generateQR() {
            var inputText = document.getElementById("qr-input").value;
            var colorDark = document.getElementById("qr-color-dark").value;
            var colorLight = document.getElementById("qr-color-light").value;
            var size = document.getElementById("qr-size").value;
            
            var qrContainer = document.getElementById("qrcode");
            var qrBox = document.getElementById("qrcode-box");
            var qrActions = document.getElementById("qrcode-actions");

            if (!inputText.trim()) {
                showStatus("Vui lòng nhập văn bản hoặc đường link để tạo mã QR!", "error");
                return;
            }

            qrContainer.innerHTML = "";
            qrBox.classList.remove("active");
            qrActions.classList.add("hidden");

            qrcode = new QRCode(qrContainer, {
                text: inputText,
                width: parseInt(size),
                height: parseInt(size),
                colorDark : colorDark,
                colorLight : colorLight,
                correctLevel : QRCode.CorrectLevel.H
            });
            
            setTimeout(() => {
                qrBox.classList.add("active");
                qrActions.classList.remove("hidden");
                showStatus("Đã tạo mã QR thành công!", "success");
            }, 100); 
        }

        function copyLink() {
            const inputText = document.getElementById("qr-input").value;
            if (!inputText) return;
            navigator.clipboard.writeText(inputText).then(() => {
                showStatus("Đã sao chép nội dung vào bộ nhớ tạm!", "success");
            });
        }

        function openQRImage() {
            const qrImage = document.querySelector("#qrcode img");
            if (!qrImage) return;
            // Mở ảnh ra tab mới để người dùng nhấn giữ lưu cực kỳ dễ dàng không bị lỗi pop-up
            const newWindow = window.open();
            newWindow.document.write(`<body style="background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;color:#fff;font-family:sans-serif;"><img src="${qrImage.src}" style="border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-width:90%;"/><p style="margin-top:20px;font-size:14px;color:#94a3b8;">Nhấn giữ vào ảnh để lưu về máy</p></body>`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateQR();
        });
    </script>
</body>
</html>
